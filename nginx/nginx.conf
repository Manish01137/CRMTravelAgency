# Bootstrap config — deploy THIS FIRST (before you have an SSL certificate).
# HTTP only: serves the app, proxies /api to the backend, and serves the
# ACME HTTP-01 challenge Certbot needs to issue a certificate. Once Certbot
# succeeds (see DEPLOYMENT_VPS.md), replace this file with nginx.ssl.conf
# and `docker compose restart web`.

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Certbot's HTTP-01 challenge — must stay reachable over plain HTTP even
    # after you switch to the SSL config below (that config also serves this).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Backend API — the `backend` hostname resolves via Docker Compose's
    # internal network (see docker-compose.prod.yml), not localhost.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router — any path that isn't a real static file falls back to
    # index.html so client-side routing (and the public /:slug Host Page
    # route) works on a hard refresh/direct link.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
