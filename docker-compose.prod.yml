# Production deployment — Phase 4 (Final Deployment).
#
# Supabase remains the hosted database (see backend/.env on the VPS) — there
# is deliberately NO `db` service here, unlike docker-compose.yml (that one's
# local-Postgres-for-development-only; untouched by this file).
#
# Usage on the VPS:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# See DEPLOYMENT_VPS.md for the full first-time setup walkthrough
# (env vars, DNS, Certbot).

services:
  redis:
    image: redis:7-alpine
    container_name: crm_redis
    restart: unless-stopped
    volumes:
      - crm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: crm_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Redis is only reachable via Docker's internal network under this
      # hostname — .env's REDIS_URL should be redis://redis:6379.
      NODE_ENV: production
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "4000"

  web:
    build: ./frontend
    container_name: crm_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Swap between ./nginx/nginx.conf (HTTP-only bootstrap) and
      # ./nginx/nginx.ssl.conf (after Certbot) — see DEPLOYMENT_VPS.md.
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro

  certbot:
    image: certbot/certbot
    container_name: crm_certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    # No `command` here — this container's job is just to hold the shared
    # volumes ready. Run the actual certbot command manually (see
    # DEPLOYMENT_VPS.md), then set up the renewal cron the doc describes.
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do sleep 12h; done"]

volumes:
  crm_redis_data:
  certbot_www:
  certbot_conf:
