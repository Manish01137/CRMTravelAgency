<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Joinetra — Travel CRM for agencies</title>
    <meta
      name="description"
      content="Joinetra is the travel CRM for tour operators and travel agencies — WhatsApp &amp; Instagram inbox, chatbots, leads, packages, bookings, invoices and your team in one place."
    />

    <!-- Logo: browser tab, Google search results, phones' home screen -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#6C2BF2" />
    <meta name="application-name" content="Joinetra" />
    <meta name="apple-mobile-web-app-title" content="Joinetra" />

    <!-- Link previews (WhatsApp, Facebook, LinkedIn, X) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Joinetra" />
    <meta property="og:title" content="Joinetra — Travel CRM for agencies" />
    <meta property="og:description" content="WhatsApp &amp; Instagram inbox, chatbots, leads, packages, bookings and invoices for travel agencies." />
    <meta property="og:url" content="https://joinetra.com/" />
    <meta property="og:image" content="https://joinetra.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Joinetra logo — Travel CRM for agencies" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Joinetra — Travel CRM for agencies" />
    <meta name="twitter:description" content="WhatsApp &amp; Instagram inbox, chatbots, leads, packages, bookings and invoices for travel agencies." />
    <meta name="twitter:image" content="https://joinetra.com/og-image.png" />

    <!-- Google: site name + logo in search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://joinetra.com/#organization",
            "name": "Joinetra",
            "url": "https://joinetra.com/",
            "logo": { "@type": "ImageObject", "url": "https://joinetra.com/icon-512.png", "width": 512, "height": 512 }
          },
          {
            "@type": "WebSite",
            "@id": "https://joinetra.com/#website",
            "name": "Joinetra",
            "alternateName": ["Joinetra CRM", "Joinetra Travel CRM"],
            "url": "https://joinetra.com/",
            "publisher": { "@id": "https://joinetra.com/#organization" }
          },
          {
            "@type": "SoftwareApplication",
            "name": "Joinetra",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "https://joinetra.com/",
            "image": "https://joinetra.com/icon-512.png",
            "description": "Travel CRM for tour operators and travel agencies — WhatsApp & Instagram inbox, chatbots, leads, packages, bookings and invoices.",
            "publisher": { "@id": "https://joinetra.com/#organization" }
          }
        ]
      }
    </script>

    <!-- Site font: Figtree everywhere (the same family joinether.in uses),
         plus Caveat for handwritten annotations.
         The extra display families power the premium package-page themes:
         Bebas Neue (adventure), Playfair Display (luxury/romance),
         Space Grotesk (wildlife/modern), Lora (pilgrimage/heritage).
         Anton + Alex Brush: the fixed "Signature" package PDF template
         (tall condensed-impact headings + flowing script eyebrow labels). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&family=Caveat:wght@600;700&family=Bebas+Neue&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600;1,700&family=Space+Grotesk:wght@500;700&family=Lora:ital,wght@0,500;0,600;1,600&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,600;1,700;1,800&family=Anton&family=Alex+Brush&family=Baloo+2:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
